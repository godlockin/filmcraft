[package]
name = "filmcraft-server"
description = "FilmCraft headless HTTP/WebSocket server (cloud video editing platform)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "filmcraft-server"
path = "src/main.rs"

[features]
default = []

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-format = { workspace = true }
filmcraft-project = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
# M2.6: `AuthStore` is an async trait so a future `DbAuthStore` can do
# real I/O without changing the handler signatures. `async-trait` is
# the simplest stable implementation; the rest of the workspace doesn't
# need it.
async-trait = "0.1"

[dev-dependencies]
# WS round-trip integration tests. Pinned to the same version the workspace
# already pulls in transitively through axum's `ws` feature (see
# `Cargo.lock`), so no new dependency graph is added for normal builds —
# only `cargo test -p filmcraft-server` brings it in.
tokio-tungstenite = "0.29"
futures-util = "0.3"
